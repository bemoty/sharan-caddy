name: build

on:
  push:
    branches: [main]
    paths:
      - modules.json
      - Dockerfile
      - go.mod
      - tools/modtool/**
      - packaging/sharan-caddy/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - modules.json
      - Dockerfile
      - go.mod
      - tools/modtool/**
      - packaging/sharan-caddy/**
      - .github/workflows/build.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Caddy version, empty for latest'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      caddy_version: ${{ steps.version.outputs.value }}
      modules_hash: ${{ steps.hash.outputs.value }}
      bundles: ${{ steps.bundles.outputs.json }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Resolve Caddy version
        id: version
        run: |
          VERSION="${{ inputs.caddy_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -sf https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r .tag_name)
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute modules hash
        id: hash
        run: echo "value=$(sha256sum modules.json | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Read bundle names
        id: bundles
        run: echo "json=$(go run ./tools/modtool bundles)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJson(needs.prepare.outputs.bundles) }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          VER="${{ needs.prepare.outputs.caddy_version }}"
          VER="${VER#v}"
          MAJOR_MINOR="$(echo "$VER" | cut -d. -f1,2)"
          HASH="${{ needs.prepare.outputs.modules_hash }}"
          BUNDLE="${{ matrix.bundle }}"
          REPO="ghcr.io/${{ github.repository_owner }}/sharan-caddy"
          if [ "$BUNDLE" = "latest" ]; then
            IMMUTABLE="${REPO}:${VER}-${HASH}"
            echo "list=${REPO}:latest,${REPO}:${MAJOR_MINOR},${REPO}:${VER},${IMMUTABLE}" >> "$GITHUB_OUTPUT"
          else
            IMMUTABLE="${REPO}:${VER}-${BUNDLE}-${HASH}"
            echo "list=${REPO}:${BUNDLE},${REPO}:${MAJOR_MINOR}-${BUNDLE},${REPO}:${VER}-${BUNDLE},${IMMUTABLE}" >> "$GITHUB_OUTPUT"
          fi
          echo "immutable=${IMMUTABLE}" >> "$GITHUB_OUTPUT"
          echo "first=${REPO}:${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            BUNDLE=${{ matrix.bundle }}
            CADDY_VERSION=${{ needs.prepare.outputs.caddy_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Module smoke test
        run: |
          IDS=$(go run ./tools/modtool ids "${{ matrix.bundle }}")
          OUTPUT=$(docker run --rm "${{ steps.tags.outputs.first }}" caddy list-modules)
          STATUS=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            if ! echo "$OUTPUT" | grep -qF "$id"; then
              echo "missing module: $id" >&2
              STATUS=1
            fi
          done <<< "$IDS"
          exit $STATUS

      - name: File issue on failure
        if: failure() && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: 'Build failed: ${{ matrix.bundle }} (${{ needs.prepare.outputs.caddy_version }})'
          content-filepath: .github/ISSUE_TEMPLATE/build-failed.md
          labels: build-failure

  package:
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUNDLE: latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Compute release identifiers
        id: release
        run: |
          VER="${{ needs.prepare.outputs.caddy_version }}"
          VER="${VER#v}"
          HASH="${{ needs.prepare.outputs.modules_hash }}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}-${HASH}" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.release.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.existing.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install xcaddy, nfpm and go-md2man
        if: steps.existing.outputs.skip == 'false'
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.6
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          go install github.com/cpuguy83/go-md2man/v2@v2.0.7

      - name: Build binaries
        if: steps.existing.outputs.skip == 'false'
        run: |
          MODULES=$(go run ./tools/modtool xcaddy-args "$BUNDLE")
          for ARCH in amd64 arm64; do
            mkdir -p "dist/${ARCH}"
            CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" xcaddy build "v${{ steps.release.outputs.version }}" $MODULES --output "dist/${ARCH}/sharan-caddy"
          done

      - name: Binary smoke test
        if: steps.existing.outputs.skip == 'false'
        run: |
          IDS=$(go run ./tools/modtool ids "$BUNDLE")
          OUTPUT=$(dist/amd64/sharan-caddy list-modules)
          STATUS=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            if ! echo "$OUTPUT" | grep -qF "$id"; then
              echo "missing module: $id" >&2
              STATUS=1
            fi
          done <<< "$IDS"
          exit $STATUS

      - name: Archive binaries
        if: steps.existing.outputs.skip == 'false'
        run: |
          mkdir -p dist/archives
          for ARCH in amd64 arm64; do
            tar -C "dist/${ARCH}" -czf "dist/archives/sharan-caddy_${{ steps.release.outputs.version }}-${{ steps.release.outputs.hash }}_linux_${ARCH}.tar.gz" sharan-caddy
          done

      - name: Generate manpage
        if: steps.existing.outputs.skip == 'false'
        run: |
          mkdir -p dist/man
          IDS=$(go run ./tools/modtool ids "$BUNDLE" | paste -sd, - | sed 's/,/, /g')
          sed "s#{{MODULE_IDS}}#$IDS#" packaging/sharan-caddy/sharan-caddy.8.md > dist/man/sharan-caddy.8.md
          go-md2man -in dist/man/sharan-caddy.8.md -out dist/man/sharan-caddy.8
          gzip -9n dist/man/sharan-caddy.8

      - name: Build packages
        if: steps.existing.outputs.skip == 'false'
        run: |
          mkdir -p dist/packages
          for ARCH in amd64 arm64; do
            for FMT in deb rpm apk archlinux; do
              ARCH="$ARCH" VERSION="${{ steps.release.outputs.version }}" HASH="${{ steps.release.outputs.hash }}" \
                nfpm package --config packaging/sharan-caddy/nfpm.yaml --packager "$FMT" --target dist/packages/
            done
          done

      - name: Create release
        if: steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            dist/archives/*.tar.gz dist/packages/* \
            --repo "${{ github.repository }}" \
            --title "${{ steps.release.outputs.tag }}" \
            --notes "Caddy ${{ steps.release.outputs.version }}, modules hash ${{ steps.release.outputs.hash }}."

      - name: File issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: 'Package build failed: ${{ needs.prepare.outputs.caddy_version }}'
          content-filepath: .github/ISSUE_TEMPLATE/build-failed.md
          labels: build-failure
